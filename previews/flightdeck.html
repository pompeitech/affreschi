function panel(){return '<section class="context"><div class="row">'+face+'<div class="contextMain"><div class="row between"><h2>Contesto <span class="amount">24%</span></h2><button id="legend" class="sectionlink">Legenda</button></div><div class="bar" aria-label="24% del contesto utilizzato">'+Array.from({length:42},(_,i)=>'<i style="background:'+(['#e78c63','#e78c63','#e78c63','#e78c63','#e78c63','#e78c63','#e7b16f','#e7b16f','#79b6ac','#b09cce','#585656'][i]||'#394244')+'"></i>').join('')+'</div><small>239k / 1M token · 728k prima della compattazione</small></div></div>'+(showLegend?'<div class="legend" style="margin-top:8px"><span style="--c:#e78c63">Messaggi</span><span style="--c:#e7b16f">Strumenti</span><span style="--c:#79b6ac">MCP</span><span style="--c:#b09cce">Sistema</span></div>':'')+'</section>'}
